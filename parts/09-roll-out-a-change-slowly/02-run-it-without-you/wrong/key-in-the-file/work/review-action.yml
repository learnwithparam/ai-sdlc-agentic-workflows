# Copy this file to .github/workflows/ in your own repo to turn it on.
name: Claude review
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: sk-ant-api03-not-a-real-key
          prompt: "Review this pull request against work/spec.md. Report Important findings and nits. Do not edit files."
          claude_args: "--max-turns 8"
