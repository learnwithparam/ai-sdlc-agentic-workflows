# The Claude Code ladder (L0 to L6). Each feature maps to the step that uses it.
# status "taught": the step's README or prompts.md names the feature, and ladder.ts checks that.
# status "todo": the step is chosen but its pages do not teach the feature yet.
# Every feature has a step, and every step has a check in checks/<step>.ts.

